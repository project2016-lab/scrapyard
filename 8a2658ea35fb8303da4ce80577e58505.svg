<svg xmlns="http://www.w3.org/2000/svg" width="110" height="112" viewBox="0 0 110 112"><rect x="1" y="1" width="108" height="110" rx="6" fill="#0f1720" stroke="#8bc34a" stroke-width="1.5"/><rect x="1.8" y="1.8" width="106" height="29" rx="5" fill="#17222d"/><circle cx="15" cy="16" r="8" fill="#8d6e63" stroke="#0b1118" stroke-width="1.5"/><text x="28" y="14" font-family="Sans Serif, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="start" font-weight="bold">Scrap Wheels</text><text x="28" y="25" font-family="Sans Serif, Arial, sans-serif" font-size="7" fill="#8bc34a" text-anchor="start">WHEELS - slot 2</text><text x="8" y="44" font-family="Sans Serif, Arial, sans-serif" font-size="8" fill="#90a4ae" text-anchor="start">Drive power</text><text x="102" y="44" font-family="Sans Serif, Arial, sans-serif" font-size="8.5" fill="#ffffff" text-anchor="end" font-weight="bold">3</text><rect x="8" y="47" width="94" height="3" rx="1.5" fill="#26394a"/><rect x="8" y="47" width="40.3" height="3" rx="1.5" fill="#8bc34a"/><text x="8" y="67" font-family="Sans Serif, Arial, sans-serif" font-size="7.2" fill="#90a4ae" text-anchor="start">Wobbly, but free.</text><text x="8" y="76" font-family="Sans Serif, Arial, sans-serif" font-size="7.2" fill="#90a4ae" text-anchor="start">Speed = power x gears</text><text x="8" y="85" font-family="Sans Serif, Arial, sans-serif" font-size="7.2" fill="#90a4ae" text-anchor="start">/ total weight.</text><line x1="6" y1="95" x2="104" y2="95" stroke="#26394a" stroke-width="1"/><text x="8" y="106" font-family="Sans Serif, Arial, sans-serif" font-size="7.8" fill="#ffd54f" text-anchor="start" font-weight="bold">Weight 1</text><text x="102" y="106" font-family="Sans Serif, Arial, sans-serif" font-size="7.8" fill="#ffffff" text-anchor="end">Starter part</text></svg>